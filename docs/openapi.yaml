openapi: 3.0.3
info:
  title: Pulse API
  version: 0.3.0
  description: >
    실시간 이벤트 피드백 모니터링 API. 팀 API 명세서와 정합(2026-08-06).
    식별자 규칙: 단일 이벤트 리소스(공개 읽기 + 소유자 쓰기)는 /events/{eventCode}로 통일,
    교차 관리인 모더레이션 큐만 /admin/feedbacks. 이벤트 내부 PK(id)는 URL에 노출하지 않고 경로엔 eventCode 사용.
    단, 세션은 sessionId(PK)를 경로·소감 제출(FeedbackSubmitRequest)에서 식별자로 사용함(의도된 예외).
    공개 응답은 좁힌 뷰(EventView/SessionView/FeedbackView/PublicReport)로 내부 필드 제외.
    인증: JWT는 응답 바디가 아니라 HttpOnly 쿠키(accessToken)로 발급/전송한다(XSS 토큰 탈취 방어).
    cross-site(FE Vercel ↔ BE Render)라 쿠키는 SameSite=None; Secure. SameSite 보호가 없으므로 CSRF는
    double-submit 토큰으로 막는다: 서버가 XSRF-TOKEN 쿠키(비-HttpOnly)를 내려주고, 상태변경 요청은 그 값을
    X-XSRF-TOKEN 헤더로 되돌려보내야 한다.
    세션 유지: accessToken(1h) 만료 시 refreshToken(14d, Path=/) 쿠키로 POST /auth/refresh를
    호출해 두 토큰을 재발급받는다(슬라이딩 세션). 로그인·회원가입이 두 쿠키를 함께 발급하고, 로그아웃이 둘 다 만료시킨다.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: event
  - name: feedback
  - name: admin
  - name: report
  - name: game
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >
            로그인 성공. accessToken·refreshToken을 HttpOnly 쿠키로 발급(Set-Cookie), 바디엔 로그인한 유저 정보만.
            CSRF용 XSRF-TOKEN 쿠키도 함께 내려간다.
          headers:
            Set-Cookie:
              description: "accessToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/ · refreshToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/ (+ XSRF-TOKEN 쿠키)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: "없는 사용자 / 비밀번호 불일치 (code: INVALID_CREDENTIALS)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 (가입과 동시에 자동 로그인)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: 가입 성공, accessToken·refreshToken을 HttpOnly 쿠키로 즉시 발급(자동 로그인). 바디엔 유저 정보만.
          headers:
            Set-Cookie:
              description: "accessToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/ · refreshToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/ (+ XSRF-TOKEN 쿠키)"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: "이메일 형식 오류 / 비밀번호 정책 위반 (code: VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 가입된 이메일 (code: EMAIL_ALREADY_EXISTS)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/refresh:
    post:
      tags: [auth]
      summary: 토큰 재발급 (refreshToken 쿠키로 슬라이딩 세션)
      description: >
        accessToken 만료 후 호출한다. 요청 바디 없음 — refreshToken 쿠키만으로 검증한다.
        성공 시 새 accessToken·refreshToken을 함께 재발급한다. 무상태라 서버 강제 무효화는 없다(이전 토큰은 만료까지 유효).
      security: []
      responses:
        "200":
          description: 재발급 성공. 새 accessToken·refreshToken을 Set-Cookie로 내려주고, 바디엔 유저 정보만.
          headers:
            Set-Cookie:
              description: "accessToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/ · refreshToken=<jwt>; HttpOnly; Secure; SameSite=None; Path=/"
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: "refreshToken 없음/만료/위조 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (accessToken·refreshToken 쿠키 만료)
      responses:
        "204":
          description: 로그아웃 성공. accessToken·refreshToken 쿠키를 만료시키는 Set-Cookie 반환.
          headers:
            Set-Cookie:
              description: "accessToken=; Max-Age=0 · refreshToken=; Max-Age=0 (쿠키 삭제)"
              schema:
                type: string

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 유저 조회 (새로고침 시 상태 복원)
      description: HttpOnly 쿠키라 FE가 토큰을 못 읽으므로, 로그인 여부·유저 식별은 이 엔드포인트로 확인한다.
      responses:
        "200":
          description: 현재 유저
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: "미인증 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    post:
      tags: [event]
      summary: 이벤트 생성 (인증)
      responses:
        "201":
          description: 생성 성공 (status = DRAFT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: "제목 누락/길이 초과 (code: VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
    get:
      tags: [event]
      summary: 내 이벤트 목록 조회 (인증)
      description: 페이지네이션 없음(v1). {items} 봉투로 seam 확보.
      responses:
        "200":
          description: 이벤트 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}:
    get:
      tags: [event]
      summary: 이벤트 상세 조회 (공개)
      security: []
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: 이벤트 상세 (공개 뷰, 내부 id·ownerId 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventView"
        "404":
          description: "존재하지 않는 code (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [event]
      summary: 이벤트 상태 전이 · 제목/설명 수정 (소유자만)
      description: 전 필드 optional 부분 수정. status와 title/description 동시 전송 허용.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 code (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "유효하지 않은 상태 전이 (code: INVALID_EVENT_STATE_TRANSITION). DRAFT→LIVE는 삭제되지 않은 세션이 1개 이상이어야 하며(DELETED 세션은 세지 않음), LIVE→ENDED만 허용."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [event]
      summary: 이벤트 삭제 (소프트 삭제, 소유자만)
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "204":
          description: 삭제 성공 (status = DELETED)
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 code (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: EVENT_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/sessions:
    get:
      tags: [event]
      summary: 세션 목록 조회 (공개)
      security: []
      description: 게스트 소감 제출 대상 선택 + 소유자 관리 공용. DELETED 제외.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: 세션 목록 (공개 뷰, {items} 봉투)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "404":
          description: "존재하지 않는 code (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [event]
      summary: 세션 생성 (소유자만)
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "201":
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 이벤트 (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/sessions/{sessionId}:
    patch:
      tags: [event]
      summary: 세션 수정 (제목·순서, 소유자만)
      description: 부분 수정(필드 optional).
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdateRequest"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 세션 (code: SESSION_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: SESSION_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [event]
      summary: 세션 삭제 (소프트 삭제, 소유자만)
      description: 연결된 Feedback 존재 여부는 삭제 조건이 아님.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "204":
          description: 삭제 성공 (status = DELETED)
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 세션 (code: SESSION_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: SESSION_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/feedbacks:
    post:
      tags: [feedback]
      summary: 소감 제출 (공개, 클라이언트 태깅 계약)
      description: >
        처리 순서: Event LIVE·세션 ACTIVE 확인 → 제출 빈도 제한 → 저장.
        toxic=true면 저장 시 status=HIDDEN으로 넣어 게스트 집계 스냅샷(VISIBLE)에서 즉시 제외한다.
        주최자는 /admin/feedbacks?includeHidden=true&toxic=true 로 자동숨김된 소감을 검토·복원할 수 있다.
      security: []
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - name: X-Client-Id
          in: header
          required: false
          schema:
            type: string
          description: 익명 브라우저 UUID(FE localStorage). 레이트리밋 키. 없으면 IP 폴백.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmitRequest"
      responses:
        "201":
          description: 제출 성공 (제출자 본인 소감 회수)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackView"
        "400":
          description: "값 검증 실패 (code: VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Event가 LIVE 아님 (code: EVENT_NOT_LIVE) / 세션이 CLOSED (code: SESSION_CLOSED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "제출 빈도 초과 — (sessionId, X-Client-Id→IP)당 분당 3회 (code: RATE_LIMIT_EXCEEDED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [feedback]
      summary: 실시간 집계 조회 (폴링 스냅샷, 공개)
      security: []
      description: 서버 집계(순수 SQL). VISIBLE 소감 기준. 폴링/SSE 동일 모양.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: VISIBLE Feedback 집계 스냅샷
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackSnapshot"

  /events/{eventCode}/feedbacks/stream:
    get:
      tags: [feedback]
      summary: 실시간 집계 구독 (SSE)
      security: []
      description: >
        공개. 연결 시 현재 스냅샷 1건을 보내고, 소감 제출·모더레이션으로 바뀔 때마다 갱신 스냅샷을 push한다(폴링 대체).
        각 이벤트는 name=snapshot, data는 GET /feedbacks와 동일한 FeedbackSnapshot JSON. ~25초마다 :ping 코멘트(idle 차단).
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 특정 세션으로 스냅샷을 좁힘(GET /feedbacks와 동일).
      responses:
        "200":
          description: text/event-stream 으로 FeedbackSnapshot(name=snapshot) 반복 전송
          content:
            text/event-stream:
              schema:
                type: string

  /events/{eventCode}/sessions/stream:
    get:
      tags: [event]
      summary: 세션 목록 실시간 구독 (SSE)
      security: []
      description: >
        공개. 연결 시 현재 세션 목록 1건을 보내고, 주최자가 세션을 열고/닫거나 생성·삭제할 때마다 갱신 목록을 push한다.
        게스트가 새로고침 없이 세션 open/close를 반영받는다. 각 이벤트는 name=snapshot, data는 GET /sessions와 동일한 SessionListResponse JSON.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: text/event-stream 으로 SessionListResponse(name=snapshot) 반복 전송
          content:
            text/event-stream:
              schema:
                type: string

  /events/{eventCode}/report/generate:
    post:
      tags: [report]
      summary: 리포트 생성 요청 (소유자만, 비동기)
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "202":
          description: 비동기 처리 시작, 상태는 GENERATING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "ENDED 아님(code: EVENT_NOT_ENDED) / 이미 생성중·완료(code: REPORT_ALREADY_EXISTS)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: "LLM 호출 실패 (code: REPORT_GENERATION_FAILED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/report:
    get:
      tags: [report]
      summary: 리포트 조회 (공개 + 소유자, auth 인식)
      security:
        - {}
        - cookieAuth: []
      description: 소유자(인증)는 isPublic 무관 Report 전체, 게스트(비인증)는 isPublic=true일 때만 PublicReport.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: 소유자면 Report 전체, 게스트면 PublicReport
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Report"
                  - $ref: "#/components/schemas/PublicReport"
        "404":
          description: "리포트 없음 / (게스트에게) 비공개 (code: REPORT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [report]
      summary: 리포트 공개 여부 토글 (소유자만)
      description: >
        status가 GENERATED인 리포트만 토글 가능. GENERATING/FAILED이거나 리포트가 없으면
        REPORT_NOT_FOUND(404) — 미완성 리포트를 공개하면 게스트가 빈 PublicReport를 받기 때문.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPublishRequest"
      responses:
        "200":
          description: 토글된 Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "리포트 없음(아직 생성 전) 또는 status가 GENERATED 아님(GENERATING/FAILED) (code: REPORT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feedbacks:
    get:
      tags: [admin]
      summary: 모더레이션 큐 조회 (소유자만)
      description: 관리자 풀뷰(toxic/taggerVersion/status 포함). {items} 봉투.
      parameters:
        - name: eventCode
          in: query
          required: false
          schema:
            type: string
          description: 특정 이벤트로 좁힘(없으면 내 전체 이벤트)
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 특정 세션으로 좁힘
        - name: toxic
          in: query
          required: false
          schema:
            type: boolean
        - name: includeHidden
          in: query
          required: false
          description: true면 HIDDEN 상태 소감도 포함
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 모더레이션 큐 (AdminFeedbackView 목록)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListResponse"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feedbacks/stream:
    get:
      tags: [admin]
      summary: 모더레이션 큐 실시간 구독 (SSE, 소유자만)
      description: >
        소유자 전용. 연결 시 현재 큐 1건을 보내고, 소감 제출·숨김/해제/삭제로 바뀔 때마다 갱신 큐를 push한다.
        각 이벤트는 name=snapshot, data는 GET /admin/feedbacks와 동일한 FeedbackListResponse JSON.
      parameters:
        - name: eventCode
          in: query
          required: true
          schema:
            type: string
          description: 구독할 이벤트(소유권 검증 대상).
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: toxic
          in: query
          required: false
          schema:
            type: boolean
        - name: includeHidden
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: text/event-stream 으로 FeedbackListResponse(name=snapshot) 반복 전송
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 이벤트 (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feedbacks/{feedbackId}/hide:
    patch:
      tags: [admin]
      summary: 소감 숨김 (소유자만)
      parameters:
        - $ref: "#/components/parameters/FeedbackIdPath"
      responses:
        "200":
          description: status = HIDDEN 으로 전이된 Feedback(풀뷰)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackView"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 소감 (code: FEEDBACK_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: FEEDBACK_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feedbacks/{feedbackId}/show:
    patch:
      tags: [admin]
      summary: 소감 숨김 해제 (소유자만)
      parameters:
        - $ref: "#/components/parameters/FeedbackIdPath"
      responses:
        "200":
          description: status = VISIBLE 로 전이된 Feedback(풀뷰)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackView"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 소감 (code: FEEDBACK_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: FEEDBACK_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/feedbacks/{feedbackId}/delete:
    patch:
      tags: [admin]
      summary: 소감 삭제 (소프트 삭제, 소유자만)
      parameters:
        - $ref: "#/components/parameters/FeedbackIdPath"
      responses:
        "200":
          description: status = DELETED 로 전이된 Feedback(풀뷰)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFeedbackView"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 소감 (code: FEEDBACK_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "이미 DELETED 상태 (code: FEEDBACK_ALREADY_DELETED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/games:
    post:
      tags: [game]
      summary: 미니게임 생성 (소유자만)
      description: 핀볼 레이스. status=DRAFT, gameType=PINBALL로 시작.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameCreateRequest"
      responses:
        "201":
          description: 생성 성공 (status = DRAFT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameView"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 이벤트 (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [game]
      summary: 게임 목록 조회 (소유자만)
      description: 이벤트의 전체 게임(최근 생성 순). DRAFT 포함.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: 게임 목록 ({items} 봉투)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameListResponse"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "존재하지 않는 이벤트 (code: EVENT_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/games/current:
    get:
      tags: [game]
      summary: 현재 게임 조회 (공개)
      security: []
      description: DRAFT를 제외한 가장 최근 게임 1개. 게스트 참가 화면용.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
      responses:
        "200":
          description: 현재 게임 (공개 뷰)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameView"
        "404":
          description: "조건에 맞는 게임 없음 (code: GAME_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/games/{gameId}:
    get:
      tags: [game]
      summary: 게임 단건 조회 (공개)
      security: []
      description: 이벤트 스코프. 상태·참가자·결과(순위) 포함.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/GameIdPath"
      responses:
        "200":
          description: 게임 상세 (공개 뷰)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameView"
        "404":
          description: "해당 이벤트에 그 게임 없음 (code: GAME_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [game]
      summary: 게임 상태 전이 (소유자만)
      description: >
        단방향 상태머신 DRAFT→OPEN→RUNNING→FINISHED. 한 단계씩만 전진(되돌리기·건너뛰기 불가).
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/GameIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameStatusUpdateRequest"
      responses:
        "200":
          description: 전이 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameView"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "해당 이벤트에 그 게임 없음 (code: GAME_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "종료된 게임 (code: GAME_ALREADY_FINISHED) / 잘못된 전이 (code: INVALID_GAME_STATE_TRANSITION)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/games/{gameId}/results:
    post:
      tags: [game]
      summary: 게임 결과(순위) 확정 (소유자만)
      description: >
        게임이 RUNNING일 때만 허용. ranking=참가자 PK 배열(1등이 첫 원소). 서버는 소속·중복만 검증(A안)하고
        순위 자체는 신뢰한다. 저장 후 FINISHED로 전이.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/GameIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameResultRequest"
      responses:
        "200":
          description: 종료 성공 (순위 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameView"
        "400":
          description: "ranking에 비소속 참가자 또는 중복 (code: VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "인증 필요 (code: UNAUTHORIZED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "소유자 아님 (code: NOT_OWNER)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "해당 이벤트에 그 게임 없음 (code: GAME_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "종료된 게임 (code: GAME_ALREADY_FINISHED) / RUNNING 아님 (code: INVALID_GAME_STATE_TRANSITION)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events/{eventCode}/games/{gameId}/participants:
    post:
      tags: [game]
      summary: 게임 참가 / 재참가 (공개)
      security: []
      description: >
        게임이 OPEN일 때만 허용. X-Client-Id로 게스트를 식별한다. 같은 clientId로 다시 참가하면 닉네임만
        갱신하고 200, 신규면 201.
      parameters:
        - $ref: "#/components/parameters/EventCodePath"
        - $ref: "#/components/parameters/GameIdPath"
        - name: X-Client-Id
          in: header
          required: true
          schema:
            type: string
          description: 익명 브라우저 UUID(FE localStorage). 참가자 식별·재참가 키. 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantJoinRequest"
      responses:
        "201":
          description: 신규 참가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantView"
        "200":
          description: 재참가 (닉네임 갱신)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantView"
        "400":
          description: "닉네임 검증 실패 또는 X-Client-Id 누락 (code: VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "해당 이벤트에 그 게임 없음 (code: GAME_NOT_FOUND)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "게임이 OPEN 아님 (code: GAME_NOT_OPEN)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT를 담은 HttpOnly 쿠키. 서버가 로그인·회원가입 시 Set-Cookie로 발급.

  parameters:
    EventCodePath:
      name: eventCode
      in: path
      required: true
      schema:
        type: string
    SessionIdPath:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FeedbackIdPath:
      name: feedbackId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    GameIdPath:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 에러 코드 v1(25개).
          enum:
            - VALIDATION_ERROR
            - INVALID_CREDENTIALS
            - UNAUTHORIZED
            - NOT_OWNER
            - CSRF_TOKEN_INVALID
            - EMAIL_ALREADY_EXISTS
            - EVENT_NOT_FOUND
            - SESSION_NOT_FOUND
            - FEEDBACK_NOT_FOUND
            - REPORT_NOT_FOUND
            - GAME_NOT_FOUND
            - EVENT_NOT_LIVE
            - SESSION_CLOSED
            - INVALID_EVENT_STATE_TRANSITION
            - EVENT_ALREADY_DELETED
            - FEEDBACK_ALREADY_DELETED
            - SESSION_ALREADY_DELETED
            - EVENT_NOT_ENDED
            - REPORT_ALREADY_EXISTS
            - GAME_NOT_OPEN
            - INVALID_GAME_STATE_TRANSITION
            - GAME_ALREADY_FINISHED
            - RATE_LIMIT_EXCEEDED
            - REPORT_GENERATION_FAILED
            - INTERNAL_ERROR
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthUser:
      type: object
      description: 로그인·회원가입·/auth/me 공통 응답(토큰은 바디에 없음, 쿠키로 발급).
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 32
          description: 8~32자, 영문+숫자 각 1자 이상 필수, 특수문자 허용.
          pattern: '^(?=.*[A-Za-z])(?=.*\d).+$'

    EventStatus:
      type: string
      enum: [DRAFT, LIVE, ENDED, DELETED]

    Event:
      type: object
      description: 소유자·인증 응답용 전체 뷰.
      required: [id, code, title, eventDate, ownerId, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          description: 참가자 진입 링크용 공개 식별자, UNIQUE
        title:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
          nullable: true
        eventDate:
          type: string
          format: date
          description: >-
            행사가 열리는 달력 날짜(YYYY-MM-DD, 타임존 없음). 생성 시각 createdAt과 별개.
            클라이언트는 문자열로 다루고, Date 객체 변환 시 로컬 타임존으로 하루 밀릴 수 있으니 date-only 파서 사용 권장.
        ownerId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/EventStatus"
        createdAt:
          type: string
          format: date-time

    EventView:
      type: object
      description: 공개 이벤트 뷰 (내부 id·ownerId 제외).
      required: [code, title, eventDate, status, createdAt]
      properties:
        code:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        eventDate:
          type: string
          format: date
          description: >-
            행사가 열리는 달력 날짜(YYYY-MM-DD, 타임존 없음).
            클라이언트는 문자열로 다루고, Date 객체 변환 시 로컬 타임존으로 하루 밀릴 수 있으니 date-only 파서 사용 권장.
        status:
          $ref: "#/components/schemas/EventStatus"
        createdAt:
          type: string
          format: date-time

    EventListResponse:
      type: object
      description: 목록 봉투(페이지네이션 seam).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    EventCreateRequest:
      type: object
      required: [title, eventDate]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
        eventDate:
          type: string
          format: date
          description: >-
            행사가 열리는 달력 날짜(YYYY-MM-DD, 타임존 없음). 생성 시각 createdAt과 별개.
            클라이언트는 문자열로 다루고, Date 객체 변환 시 로컬 타임존으로 하루 밀릴 수 있으니 date-only 파서 사용 권장.

    EventUpdateRequest:
      type: object
      description: 부분 수정(모든 필드 optional). code·ownerId·createdAt은 수정 불가.
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 60
        description:
          type: string
          maxLength: 500
        status:
          type: string
          enum: [LIVE, ENDED]
        eventDate:
          type: string
          format: date
          description: 행사가 열리는 달력 날짜(YYYY-MM-DD, 타임존 없음). 보낸 경우만 반영.

    Session:
      type: object
      description: 소유자 응답용 전체 뷰.
      required: [id, eventId, title, order, status]
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        title:
          type: string
        order:
          type: integer
        status:
          type: string
          description: ACTIVE=피드백 수집 중, CLOSED=마감(신규 소감 차단, 조회는 가능), DELETED=소프트 삭제.
          enum: [ACTIVE, CLOSED, DELETED]

    SessionView:
      type: object
      description: 공개 세션 뷰 (eventId 제외). DELETED는 목록에 노출되지 않음.
      required: [id, title, order, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        order:
          type: integer
        status:
          type: string
          description: ACTIVE=소감 제출 가능, CLOSED=마감.
          enum: [ACTIVE, CLOSED]

    SessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"

    SessionCreateRequest:
      type: object
      required: [title, order]
      properties:
        title:
          type: string
        order:
          type: integer

    SessionUpdateRequest:
      type: object
      description: 부분 수정(필드 optional). status로 ACTIVE↔CLOSED 전환(마감/재개). DELETED는 DELETE 엔드포인트로.
      properties:
        title:
          type: string
        order:
          type: integer
        status:
          type: string
          enum: [ACTIVE, CLOSED]

    Sentiment:
      type: string
      enum: [POS, NEU, NEG, UNKNOWN]
      description: UNKNOWN은 태깅 실패(NEU와 다름).

    FeedbackSubmitRequest:
      type: object
      required: [sessionId, text, sentiment, toxic, keywords, taggerVersion]
      properties:
        sessionId:
          type: integer
          format: int64
        text:
          type: string
          minLength: 1
          maxLength: 200
        sentiment:
          $ref: "#/components/schemas/Sentiment"
        toxic:
          type: boolean
          description: 클라 태깅 독성 여부. true면 저장 시 즉시 HIDDEN 처리(게스트 집계 제외).
        keywords:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 20
          minItems: 0
          maxItems: 5
          uniqueItems: true
        taggerVersion:
          type: string

    FeedbackView:
      type: object
      description: 공개용 소감 뷰 (모더레이션 필드 제외).
      required: [id, sessionId, text, sentiment, keywords, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        text:
          type: string
        sentiment:
          $ref: "#/components/schemas/Sentiment"
        keywords:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    AdminFeedbackView:
      type: object
      description: 관리자 풀뷰. /admin/* 응답 전용.
      required: [id, sessionId, text, sentiment, toxic, keywords, taggerVersion, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        text:
          type: string
        sentiment:
          $ref: "#/components/schemas/Sentiment"
        toxic:
          type: boolean
        keywords:
          type: array
          items:
            type: string
        taggerVersion:
          type: string
        status:
          type: string
          enum: [VISIBLE, HIDDEN, DELETED]
        createdAt:
          type: string
          format: date-time

    FeedbackListResponse:
      type: object
      description: 관리자 목록 봉투(페이지네이션 seam).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminFeedbackView"

    KeywordCount:
      type: object
      required: [keyword, count]
      properties:
        keyword:
          type: string
        count:
          type: integer

    SentimentBreakdown:
      type: object
      description: sentiment != UNKNOWN 집계 (긍정·중립·부정 건수).
      required: [POS, NEU, NEG]
      properties:
        POS:
          type: integer
        NEU:
          type: integer
        NEG:
          type: integer

    FeedbackSnapshot:
      type: object
      description: 서버 집계 스냅샷.
      required: [sentimentBreakdown, unclassifiedCount, topKeywords, recentFeedbacks]
      properties:
        sentimentBreakdown:
          $ref: "#/components/schemas/SentimentBreakdown"
        unclassifiedCount:
          type: integer
          description: sentiment = UNKNOWN 건수
        topKeywords:
          type: array
          description: 빈도순 상위 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/KeywordCount"
        recentFeedbacks:
          type: array
          description: 최신 50 (FeedbackView)
          maxItems: 50
          items:
            $ref: "#/components/schemas/FeedbackView"

    Report:
      type: object
      description: 소유자 조회·생성·토글 응답용 전체 뷰.
      required: [id, eventId, status, isPublic]
      properties:
        id:
          type: integer
          format: int64
        eventId:
          type: integer
          format: int64
        status:
          type: string
          enum: [GENERATING, GENERATED, FAILED]
          description: NONE은 개념적 상태(행 없음).
        summaryText:
          type: string
          nullable: true
        sentimentBreakdown:
          allOf:
            - $ref: "#/components/schemas/SentimentBreakdown"
          nullable: true
        unclassifiedCount:
          type: integer
          description: sentiment = UNKNOWN 건수
          nullable: true
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCount"
          nullable: true
        isPublic:
          type: boolean
        generatedAt:
          type: string
          format: date-time
          nullable: true

    ReportPublishRequest:
      type: object
      required: [isPublic]
      properties:
        isPublic:
          type: boolean

    PublicReport:
      type: object
      description: 게스트 공개 리포트 뷰.
      required: [summaryText, sentimentBreakdown, unclassifiedCount, topKeywords]
      properties:
        summaryText:
          type: string
        sentimentBreakdown:
          $ref: "#/components/schemas/SentimentBreakdown"
        unclassifiedCount:
          type: integer
          description: sentiment = UNKNOWN 건수
        topKeywords:
          type: array
          items:
            $ref: "#/components/schemas/KeywordCount"

    GameStatus:
      type: string
      description: 단방향 상태머신. DRAFT→OPEN→RUNNING→FINISHED로 한 단계씩만 전진.
      enum: [DRAFT, OPEN, RUNNING, FINISHED]

    GameType:
      type: string
      enum: [PINBALL]

    ParticipantView:
      type: object
      description: 공개 참가자 뷰. 내부 식별자 clientId는 제외.
      required: [id, nickname, joinedAt]
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
          minLength: 1
          maxLength: 12
        joinedAt:
          type: string
          format: date-time

    GameView:
      type: object
      description: 게임 공개 뷰(단건·현재·목록 공통). 참가자는 clientId 제외.
      required: [id, title, gameType, status, participants, ranking, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 50
        gameType:
          $ref: "#/components/schemas/GameType"
        status:
          $ref: "#/components/schemas/GameStatus"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantView"
        ranking:
          type: array
          description: 참가자 PK를 등수 순서로 담은 배열(1등이 첫 원소). 종료 전엔 빈 배열.
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time

    GameListResponse:
      type: object
      description: 게임 목록 봉투(주최자용, {items} seam).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GameView"

    GameCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 50

    GameStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/GameStatus"

    GameResultRequest:
      type: object
      required: [ranking]
      properties:
        ranking:
          type: array
          minItems: 1
          description: 참가자 PK 순위(1등이 첫 원소). 서버는 소속·중복만 검증.
          items:
            type: integer
            format: int64

    ParticipantJoinRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 12

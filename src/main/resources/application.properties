spring.application.name=pulse-backend

# Render 등 PaaS는 $PORT 환경변수로 포트를 주입. 없으면 로컬 8080.
server.port=${PORT:8080}

# --- JPA (개발용) ---
# ddl-auto=update: 엔티티 기준으로 스키마 자동 반영(개발 편의). 운영 배포 DB엔 create 금지.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- DataSource ---
# 로컬: 루트의 application-local.properties(gitignore됨)에서 접속정보 주입.
# 운영(Render): 환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 로 주입(파일 없어도 optional이라 무시).
spring.config.import=optional:file:./application-local.properties

# --- JWT ---
# secret은 커밋하지 않는다. 로컬은 gitignore된 application-local.properties에서, 배포(Render)는 env JWT_SECRET로 주입.
# 폴백 없음 → 미설정 시 부팅 실패. 소스에 박힌 키로 외부에서 토큰이 위조되는 것을 원천 차단(HS256이라 최소 32바이트 필요).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

spring.application.name=pulse-backend

# Render 등 PaaS는 $PORT 환경변수로 포트를 주입. 없으면 로컬 8080.
server.port=${PORT:8080}

# --- JPA (개발용) ---
# ddl-auto=update: 엔티티 기준으로 스키마 자동 반영(개발 편의). 운영 배포 DB엔 create 금지.
spring.jpa.hibernate.ddl-auto=update
# show-sql 기본 off(배포 로그가 SQL로 도배되는 것 방지). 로컬은 application-local.properties에서 true로 켠다.
# 배포에서 잠깐 SQL이 필요하면 env JPA_SHOW_SQL=true.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- DataSource ---
# 로컬: 루트의 application-local.properties(gitignore됨)에서 접속정보 주입.
# 운영(Render): 환경변수 SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD 로 주입(파일 없어도 optional이라 무시).
spring.config.import=optional:file:./application-local.properties

# --- CORS ---
# 허용 origin(쉼표 구분). 로컬 기본값. 배포(Vercel)는 env CORS_ALLOWED_ORIGINS로 정확한 도메인 주입.
# 와일드카드(*.vercel.app) 금지 — 임의 배포 사이트가 인증 응답을 읽는 것 차단(CWE-942).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# --- JWT ---
# secret은 커밋하지 않는다. 로컬은 gitignore된 application-local.properties에서, 배포(Render)는 env JWT_SECRET로 주입.
# 폴백 없음 → 미설정 시 부팅 실패. 소스에 박힌 키로 외부에서 토큰이 위조되는 것을 원천 차단(HS256이라 최소 32바이트 필요).
jwt.secret=${JWT_SECRET}
# 액세스 토큰은 짧게(1h) — 만료 시 refresh 토큰으로 조용히 재발급(POST /auth/refresh). 배포는 env로 조정.
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:3600000}
# 리프레시 토큰(14d): 이 기간 재접속 없으면 재로그인. 무상태라 로그아웃=쿠키 삭제(서버 강제 무효화는 없음).
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:1209600000}

# --- 인증/CSRF 쿠키 ---
# 로컬(http, localhost=same-site) 기본: Secure=false, SameSite=Lax → http에서도 쿠키가 붙는다.
# 배포(https, Vercel↔Render=cross-site)는 env로 AUTH_COOKIE_SECURE=true, AUTH_COOKIE_SAME_SITE=None 주입.
# 주의: SameSite=None은 Secure=true와 짝이어야 함(브라우저 규칙).
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# --- open router --
openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.read-timeout=${OPENROUTER_READ_TIMEOUT:30s}
